<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <!-- AG Monogram Icon -->
  <g transform="translate(300, 200)">
    <!-- Letter A - Navy Blue -->
    <path d="M -80 80 L 0 -100 L 80 80 L 50 80 L 0 -20 L -50 80 Z" fill="#0A2540" stroke="#0A2540" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -30 30 L 30 30" stroke="#0A2540" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Letter G - Teal -->
    <g transform="translate(120, 0)">
      <path d="M 0 -80 C -35 -80 -60 -55 -60 -20 L -60 20 C -60 55 -35 80 0 80 L 40 80 L 40 20 L -10 20 L -10 50 L 10 50 L 10 55 L -5 55 C -20 55 -30 45 -30 30 L -30 -30 C -30 -45 -20 -55 -5 -55 C 10 -55 20 -45 20 -30 L 20 -10 L 50 -10 L 50 -30 C 50 -60 30 -80 0 -80 Z" fill="#14B8A6"/>
    </g>
    
    <!-- DNA Helix connecting curves -->
    <path d="M 50 50 Q 70 30 90 10" stroke="#14B8A6" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 40 65 Q 60 45 80 25" stroke="#0A2540" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- AFRIGENOMIX Text -->
  <text x="300" y="400" font-family="'Arial', 'Helvetica', sans-serif" font-size="72" font-weight="700" text-anchor="middle" letter-spacing="4">
    <tspan fill="#0A2540">AFRI</tspan>
    <tspan fill="#14B8A6">GENOMIX</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="300" y="460" font-family="'Arial', 'Helvetica', sans-serif" font-size="32" text-anchor="middle" letter-spacing="6">
    <tspan fill="#0A2540">Truth </tspan>
    <tspan fill="#14B8A6">Through </tspan>
    <tspan fill="#0A2540">Science</tspan>
  </text>
</svg>
